# plans/esmini_embed.yaml
name: esmini_embedded_controller_distribution
mode: A # A: planning-only, B: full-stack (ROS2)
runtime:
  dt: 0.01
  av:
    connect_time_limit_s: 30
    retry: 1
  time_limit_s: 60
  resources:
    cpu: 8
    gpu: none
    mem_gb: 16
  seed: 123456

artifacts:
  record:
    - rosbag
    - video
    - state
  out_dir: artifacts/mvp

scenarios:
  - scenarios/mvp_distribution/plan.yaml

simulator:
  name: esmini
  module: sv.sim.esmini:EsminiAdapter
  cfg_path: configs/sim/esmini_docker.yaml

av:
  name: autoware_pure
  module: sv.av.autoware_pure:AutowarePureAV
  cfg_path: configs/av/autoware_pure.yaml

bridge:
  name: none
  module: sv.bridge.none:NoneBridge

monitor:
  name: default
  module: sv.monitor.default:defaultMonitor
  cfg_path: configs/monitor/default.yaml

sampler:
  name: grid_search
  module: sv.sampler.grid_search_sampler:GridSearchSampler
