  cfg_path: configs/av/autoware_pure.yaml
map:
  name: test_map
  xodr_path: ./scenarios/mvp_distribution/maps/e6mini.xodr
  osm_path: ./scenarios/mvp/maps/e6mini_same.osm
scenario:
  title: test_scenario
  scenario_path: ./scenarios/mvp_distribution/scenarios/DEMO_CI_e6mini.xosc
  param_path: ./scenarios/mvp_distribution/range.xosc
  ego:
    target_speed: 50
    spawn:
      type: LanePosition
      value: [0, -2, 300, 0]
      speed: 50
    goal:
      type: LanePosition
      value: [0, -4, 700, 0]

simulator:
  module: sv.sim.esmini:EsminiAdapter
  cfg_path: configs/sim/esmini_docker.yaml

sampler:
  module: sv.sampler.grid_search_sampler:GridSearchSampler

runtime:
  dt: 0.01
